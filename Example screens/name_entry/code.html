        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .cli-glow {
            box-shadow: 0px 0px 15px rgba(217, 119, 87, 0.15);
        }

            background-image: linear-gradient(to right, #1c1c1a 1px, transparent 1px),

<body class="bg-background text-on-background font-body min-h-screen flex items-center justify-center overflow-hidden">
<!-- Ambient Technical Background -->
<div class="fixed inset-0 technical-grid opacity-30 pointer-events-none"></div>
<div class="fixed top-0 left-0 w-full h-full pointer-events-none overflow-hidden">
<div class="absolute -top-[10%] -left-[5%] w-[40%] h-[40%] bg-primary/5 rounded-full blur-[120px]"></div>
<div class="absolute -bottom-[10%] -right-[5%] w-[40%] h-[40%] bg-tertiary/5 rounded-full blur-[120px]"></div>
</div>
<!-- Main Entry Container -->
<main class="relative z-10 w-full max-w-2xl px-6">
<!-- Header Section -->
<header class="mb-12 text-center md:text-left">
<div class="inline-flex items-center gap-2 mb-4">
<span class="material-symbols-outlined text-primary" data-icon="terminal">terminal</span>
<span class="font-headline font-bold tracking-tighter text-primary text-xl uppercase">CCNA AI Tutor</span>
</div>
<h1 class="font-headline text-5xl md:text-6xl font-bold text-on-surface tracking-tight leading-none mb-4">
                Welcome!
            </h1>
<p class="text-secondary text-lg font-light tracking-wide max-w-md">
                Enter your name to start your personalized Cisco Certified Network Associate training journey.
            </p>
</header>
<!-- Form Card -->
<section class="bg-surface-container-low p-8 md:p-12 rounded-lg relative overflow-hidden">
<!-- Subtle Machined Accent -->
<div class="absolute top-0 right-0 p-4 opacity-20">
<span class="text-[10px] font-mono uppercase tracking-[0.3em] text-secondary">auth_v2.0_sys</span>
</div>
<div class="space-y-8">
<div class="group">
<label class="block text-xs font-bold uppercase tracking-widest text-primary mb-3" for="username">Network Identity</label>
<div class="relative">
<input autofocus="" class="w-full bg-surface-container-lowest border-none focus:ring-1 focus:ring-primary/40 text-on-surface text-2xl md:text-3xl font-headline py-5 px-6 rounded-lg transition-all placeholder:text-surface-container-highest" id="username" placeholder="e.g. Admin_User" type="text"/>
<div class="absolute right-6 top-1/2 -translate-y-1/2 flex items-center gap-2 pointer-events-none opacity-40 group-focus-within:opacity-100 transition-opacity">
<span class="material-symbols-outlined text-primary text-sm" data-icon="edit">edit</span>
</div>
</div>
</div>
<div class="flex flex-col md:flex-row items-center gap-6">
<button class="w-full md:w-auto px-12 py-5 bg-primary-container text-on-primary-container font-headline font-bold text-lg rounded-lg cli-glow hover:brightness-110 active:scale-95 transition-all flex items-center justify-center gap-3">
<span>Start</span>
<span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
<a class="text-secondary hover:text-primary text-sm font-medium tracking-wide transition-colors flex items-center gap-2 py-2" href="#">
<span>Skip / Continue as Guest</span>
<span class="material-symbols-outlined text-base" data-icon="chevron_right">chevron_right</span>
</a>
</div>
</div>
</section>
<!-- Footer Meta Info -->
<footer class="mt-12 flex flex-col md:flex-row justify-between items-center gap-4 text-[10px] font-mono text-secondary/40 uppercase tracking-widest">
<div class="flex items-center gap-4">
<div class="flex items-center gap-1">
<span class="w-2 h-2 rounded-full bg-tertiary animate-pulse"></span>
<span>System Online</span>
</div>
<span>Node: US-WEST-2</span>
</div>
<div>
